name: Build PTZR CLOUD

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build macOS AU, VST3 and Standalone
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check build tools
        run: |
          xcodebuild -version
          cmake --version
          git --version

      - name: Configure JUCE project
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build all formats
        run: |
          cmake --build build \
            --config Release \
            --parallel 2

      - name: Collect plugin bundles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          find build -type d \
            \( -name "*.component" \
            -o -name "*.vst3" \
            -o -name "*.app" \) \
            -prune -print0 |
          while IFS= read -r -d '' item; do
            name="$(basename "$item")"

            if [ -e "dist/$name" ]; then
              echo "ERROR: Duplicate bundle name: $name"
              exit 1
            fi

            echo "Packaging $item"
            ditto "$item" "dist/$name"
          done

          if [ -z "$(find dist -mindepth 1 -print -quit)" ]; then
            echo "ERROR: No AU, VST3 or Standalone bundles found."
            echo "Review the CMake configuration and build logs."
            exit 1
          fi

          echo "Generated bundles:"
          ls -lah dist

      - name: Create ZIP
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            dist PTZR-CLOUD-macOS.zip

      - name: Upload compiled plugin
        uses: actions/upload-artifact@v4
        with:
          name: PTZR-CLOUD-macOS
          path: PTZR-CLOUD-macOS.zip
          if-no-files-found: error
          retention-days: 14
